# Pre-commit hooks for PDF-Auto-A11y
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: spotless-apply
        name: Format code with spotless
        entry: mvn spotless:apply
        language: system
        pass_filenames: false
        files: ^(src/.*|tools/.*)\.java$
        fail_fast: true

      - id: maven-test
        name: Run Maven tests
        entry: mvn test -q
        language: system
        pass_filenames: false
        files: ^(src/.*\.(java|xml|yaml)|pom\.xml)$

      - id: maven-integration-test
        name: Run Maven integration tests
        entry: mvn test -q -Dgroups=GoalDriven -Dmaven-surefire-plugin.excludedGroups=
        language: system
        pass_filenames: false
        files: ^(src/.*\.(java|xml|yaml)|pom\.xml)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
